<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>gol.json - Live Soccer</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
    <style>
        body { margin: 0; background: #000; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        #terminal { flex: 1; width: 100%; }
        #status { color: #0f0; padding: 10px; font-family: monospace; background: #222; font-size: 13px; border-bottom: 1px solid #444; line-height: 1.4; }
        a { color: #0cf; }
    </style>
</head>
<body>
    <div id="status">
        <b>GOL.JSON</b> | Status: <span id="run-status">Initializing...</span> <br/>
        Using Proxy: <code>http://cors-anywhere.com/</code> |
        Add <code>?id=EVENT_ID</code> to monitor a specific match. |
        Add <code>?mock=1</code> for demonstration.
    </div>
    <div id="terminal"></div>
    <script src="wasm_exec.js"></script>
    <script>
        const term = new Terminal({
            cursorBlink: true,
            theme: { background: '#1e1e1e' },
            convertEol: true,
            fontFamily: 'monospace',
            fontSize: 14
        });
        term.open(document.getElementById('terminal'));

        const decoder = new TextDecoder("utf-8");

        if (!globalThis.process) {
            globalThis.process = {
                getuid() { return -1; },
                getgid() { return -1; },
                geteuid() { return -1; },
                getegid() { return -1; },
                getgroups() { throw new Error("not implemented"); },
                pid: -1,
                ppid: -1,
                umask() { throw new Error("not implemented"); },
                cwd() { return "/"; },
                chdir() { throw new Error("not implemented"); },
            };
        }

        if (!globalThis.fs) {
            globalThis.fs = {
                constants: { O_WRONLY: -1, O_RDWR: -1, O_CREAT: -1, O_TRUNC: -1, O_APPEND: -1, O_EXCL: -1, O_DIRECTORY: -1 },
                writeSync(fd, buf) {
                    term.write(decoder.decode(buf));
                    return buf.length;
                },
                write(fd, buf, offset, length, position, callback) {
                    if (offset !== 0 || length !== buf.length || position !== null) {
                        callback(new Error("not implemented"));
                        return;
                    }
                    const n = this.writeSync(fd, buf);
                    callback(null, n);
                },
                chmod(path, mode, callback) { callback(null); },
                chown(path, uid, gid, callback) { callback(null); },
                close(fd, callback) { callback(null); },
                fchmod(fd, mode, callback) { callback(null); },
                fchown(fd, uid, gid, callback) { callback(null); },
                fstat(fd, callback) { callback(null, { isDirectory: () => false }); },
                fsync(fd, callback) { callback(null); },
                ftruncate(fd, length, callback) { callback(null); },
                lchown(path, uid, gid, callback) { callback(null); },
                link(path, link, callback) { callback(null); },
                lstat(path, callback) { callback(null, { isDirectory: () => false }); },
                mkdir(path, mode, callback) { callback(null); },
                open(path, flags, mode, callback) { callback(new Error("not implemented")); },
                read(fd, buf, offset, length, position, callback) { callback(new Error("not implemented")); },
                readdir(path, callback) { callback(new Error("not implemented")); },
                readlink(path, callback) { callback(new Error("not implemented")); },
                rename(from, to, callback) { callback(null); },
                rmdir(path, callback) { callback(null); },
                stat(path, callback) { callback(null, { isDirectory: () => false }); },
                symlink(path, link, callback) { callback(null); },
                truncate(path, length, callback) { callback(null); },
                unlink(path, callback) { callback(null); },
                utimes(path, atime, mtime, callback) { callback(null); },
            };
        }

        const go = new Go();
        const urlParams = new URLSearchParams(window.location.search);
        const eventId = urlParams.get('id') || "";
        const mock = urlParams.get('mock') || "0";

        // Update to the correct proxy requested by the user
        go.env = {
            "EVENT_ID": eventId,
            "USE_MOCK": mock,
            "CORS_PROXY": "http://cors-anywhere.com/"
        };

        term.writeln('Instantiating WebAssembly...');
        WebAssembly.instantiateStreaming(fetch("main.wasm"), go.importObject).then((result) => {
            document.getElementById('run-status').innerHTML = 'Running' + (eventId ? ' (Monitoring ID: ' + eventId + ')' : ' (Listing matches)');
            if (mock === "1") document.getElementById('run-status').innerHTML += ' [MOCK MODE]';
            go.run(result.instance);
        }).catch(err => {
            document.getElementById('run-status').innerText = 'Error: ' + err.message;
            document.getElementById('run-status').style.color = 'red';
            term.writeln('\x1b[31mError: ' + err.message + '\x1b[0m');
            console.error(err);
        });
    </script>
</body>
</html>
